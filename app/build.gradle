import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.quartz.downloader'
    compileSdk 36
    testBuildType 'release'

    defaultConfig {
        applicationId 'com.quartz.downloader'
        minSdk 29
        targetSdk 35
        versionCode = (project.findProperty('quartzVersionCode') ?: '11').toInteger()
        versionName = (project.findProperty('quartzVersionName') ?: '0.3.4')
        testInstrumentationRunner 'com.quartz.downloader.DownloadFlowInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    def signingFile = rootProject.file('signing/release-signing.properties')
    if (signingFile.exists()) {
        def signingProperties = new Properties()
        signingFile.withInputStream { signingProperties.load(it) }
        signingConfigs {
            release {
                storeFile rootProject.file('signing/quartz-release.p12')
                storePassword signingProperties.getProperty('storePassword')
                keyAlias 'quartz'
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packaging { jniLibs { useLegacyPackaging = true } }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    implementation 'commons-io:commons-io:2.16.1'
}

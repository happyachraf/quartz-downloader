<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app-ui.css"><link rel="stylesheet" href="browser-ui.css"></head><body class="browser-chrome"><section id="search-chrome"><header class="top"><div class="brand"><img src="logo.png" alt="Quartz"><strong>Browse</strong></div><button class="icon" data-action="done" aria-label="Close browser"><img class="ui-icon" src="icons/more_vert.svg" alt=""></button></header><form id="browser-search" class="search-field"><img class="ui-icon" src="icons/search-outline.svg" alt=""><input id="search" type="search" aria-label="Search or website address"><button type="button" id="clear-search" aria-label="Clear search"><img class="ui-icon" src="icons/close.svg" alt=""></button></form><div class="site-shortcuts"><button data-site="youtube"><span class="site-mark youtube"><img src="icons/site-youtube.svg" alt=""></span><span>YouTube</span></button><button data-site="tiktok"><span class="site-mark tiktok"><img src="icons/site-tiktok.svg" alt=""></span><span>TikTok</span></button><button data-site="x"><span class="site-mark x"><img src="icons/site-x.svg" alt=""></span><span>X</span></button><button data-site="facebook"><span class="site-mark facebook"><img src="icons/site-facebook.svg" alt=""></span><span>Facebook</span></button><button data-site="instagram"><span class="site-mark instagram"><img src="icons/site-instagram.svg" alt=""></span><span>Instagram</span></button></div></section><section id="compact-chrome" class="hidden"><div class="address-bar"><img class="browser-logo" src="logo.png" alt="Quartz"><button class="icon" data-action="back" aria-label="Back"><img class="ui-icon" src="icons/arrow_back.svg" alt=""></button><button id="address" class="address" aria-label="Edit website address"><img class="ui-icon" src="icons/lock.svg" alt=""><span></span></button><button class="icon" data-action="reload" aria-label="Re
